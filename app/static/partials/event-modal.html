<!-- Event Modal -->
<div class="modal-overlay" id="evt-modal-overlay" style="display:none">
  <div class="modal-container vks-modal-flat" id="evt-modal">
    <div class="modal-header">
      <div class="header-left">
        <h3 id="evt-modal-title">Новое мероприятие</h3>
      </div>
      <div class="header-actions">
        <button class="modal-close-btn" onclick="closeEventModal()">✕</button>
      </div>
    </div>
    <div class="modal-body" id="evt-modal-body">
      <input type="hidden" id="evt-id">

      <div class="form-group">
        <label>Тип мероприятия</label>
        <select id="evt-type" class="form-input">
          <option value="ВКС">ВКС</option>
          <option value="Совещание">Совещание</option>
          <option value="Встреча">Встреча</option>
          <option value="Заседание">Заседание</option>
          <option value="Приём">Личный приём</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Дата</label>
          <input type="date" id="evt-date" class="form-input">
        </div>
        <div class="form-group">
          <label>Время</label>
          <input type="time" id="evt-time" class="form-input">
        </div>
        <div class="form-group">
          <label>Продолжительность</label>
          <select id="evt-duration" class="form-input">
            <option value="30">30 мин</option>
            <option value="60" selected>1 час</option>
            <option value="90">1.5 часа</option>
            <option value="120">2 часа</option>
            <option value="180">3 часа</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Зал</label>
        <select id="evt-location" class="form-input">
          <option value="">— Не выбран —</option>
        </select>
      </div>

      <div class="form-group">
        <label>Организатор</label>
        <div class="form-row">
          <div class="form-group" style="flex:0 0 120px">
            <select id="evt-organizer-type" class="form-input">
              <option value="org">Организация</option>
              <option value="user">Сотрудник</option>
            </select>
          </div>
          <div class="form-group" style="flex:1">
            <select id="evt-organizer" class="form-input">
              <option value="">— Не выбран —</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Описание</label>
        <input type="text" id="evt-description" class="form-input" placeholder="Описание мероприятия">
      </div>

      <div class="form-group">
        <label>Участники</label>
        <div class="event-participants-list" id="evt-participants-list"></div>
        <div class="event-participant-add">
          <input type="text" id="evt-participant-search" class="form-input" placeholder="Поиск сотрудника...">
          <div class="event-participant-dropdown" id="evt-participant-dropdown" style="display:none"></div>
        </div>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" id="evt-notification" checked> Уведомление
        </label>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" id="evt-completed"> Завершено
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="evtCloseModal()">Отмена</button>
      <button class="btn btn-primary" id="evt-save-btn" onclick="evtSaveEvent()">Сохранить</button>
    </div>
  </div>
</div>
