<!-- Event Modal (VKS-style) -->
<div class="modal-overlay" id="evt-modal-overlay" style="display:none">
  <div class="modal modal-lg vks-modal-flat">
    <!-- Accent bar -->
    <div class="vks-modal-accent" id="evt-accent"></div>

    <!-- Header -->
    <div class="modal-header">
      <div class="vks-modal-header-left">
        <h3 id="evt-modal-title" class="vks-modal-title">Новое мероприятие</h3>
      </div>
      <div class="modal-header-actions">
        <button class="icon-btn" onclick="evtCloseModal()" title="Закрыть">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="vks-modal-body-wrapper">
      <div class="modal-body">
        <input type="hidden" id="evt-id">
        <input type="hidden" id="evt-notification" value="true">

        <!-- Тип мероприятия -->
        <div class="form-separator form-group">
          <label>Тип мероприятия</label>
          <select id="evt-type" class="form-input">
            <option value="Совещание">Совещание</option>
            <option value="Встреча">Встреча</option>
            <option value="Заседание">Заседание</option>
            <option value="Приём">Личный приём</option>
          </select>
        </div>

        <!-- Дата и время -->
        <div class="form-row form-separator">
          <div class="form-group flex-2">
            <label>Дата *</label>
            <input type="date" id="evt-date" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Время *</label>
            <input type="time" id="evt-time" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Продолжительность</label>
            <select id="evt-duration" class="form-input">
              <option value="30">30 мин</option>
              <option value="60" selected>1 час</option>
              <option value="90">1.5 часа</option>
              <option value="120">2 часа</option>
              <option value="180">3 часа</option>
            </select>
          </div>
        </div>

        <!-- Локация и Организатор -->
        <div class="form-row form-separator">
          <div class="form-group">
            <label>Локация *</label>
            <select id="evt-location" class="form-input">
              <option value="">Не указана</option>
            </select>
          </div>
          <div class="form-group">
            <label>Организатор *</label>
            <div class="form-row">
              <div class="form-group" style="flex:0 0 110px">
                <select id="evt-organizer-type" class="form-input">
                  <option value="org">Организация</option>
                  <option value="user">Сотрудник</option>
                </select>
              </div>
              <div class="form-group" style="flex:1">
                <select id="evt-organizer" class="form-input">
                  <option value="">Не указан</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Описание -->
        <div class="form-separator form-group">
          <label>Описание</label>
          <input type="text" id="evt-description" class="form-input" placeholder="Описание мероприятия" maxlength="200">
        </div>

        <!-- Участники -->
        <div class="form-separator form-group">
          <label>Участники</label>
          <div class="event-participants-list" id="evt-participants-list"></div>
          <div class="event-participant-add">
            <input type="text" id="evt-participant-search" class="form-input" placeholder="Поиск сотрудника...">
            <div class="event-participant-dropdown" id="evt-participant-dropdown" style="display:none"></div>
          </div>
        </div>

        <!-- Повторять -->
        <div class="form-separator form-group">
          <label>Повторять</label>
          <button type="button" class="pill-btn" id="evt-repeat-btn" onclick="evtToggleRepeat()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
            <span class="pill-label">Повторять</span>
          </button>
          <div class="evt-repeat-options" id="evt-repeat-options" style="display:none; margin-top:8px">
            <div class="form-row">
              <div class="form-group">
                <label>Частота</label>
                <select id="evt-repeat-freq" class="form-input">
                  <option value="weekly">Еженедельно</option>
                  <option value="biweekly">Раз в 2 недели</option>
                  <option value="monthly">Ежемесячно</option>
                </select>
              </div>
              <div class="form-group">
                <label>До даты</label>
                <input type="date" id="evt-repeat-until" class="form-input">
              </div>
            </div>
            <div class="form-group">
              <label>Дни недели</label>
              <div class="evt-weekday-row" id="evt-weekday-row">
                <button type="button" class="evt-wd-btn" data-day="mon" onclick="this.classList.toggle('active')">Пн</button>
                <button type="button" class="evt-wd-btn" data-day="tue" onclick="this.classList.toggle('active')">Вт</button>
                <button type="button" class="evt-wd-btn" data-day="wed" onclick="this.classList.toggle('active')">Ср</button>
                <button type="button" class="evt-wd-btn" data-day="thu" onclick="this.classList.toggle('active')">Чт</button>
                <button type="button" class="evt-wd-btn" data-day="fri" onclick="this.classList.toggle('active')">Пт</button>
                <button type="button" class="evt-wd-btn" data-day="sat" onclick="this.classList.toggle('active')">Сб</button>
                <button type="button" class="evt-wd-btn" data-day="sun" onclick="this.classList.toggle('active')">Вс</button>
              </div>
            </div>
          </div>
          <input type="hidden" id="evt-repeat-active" value="false">
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="evtCloseModal()">Отмена</button>
      <div class="footer-right">
        <button class="btn btn-primary" id="evt-save-btn" onclick="evtSaveEvent()">Сохранить</button>
      </div>
    </div>
  </div>
</div>
