<!-- ─── Modal: Event (Modern · Split desktop / Cards mobile) ────────── -->
<div class="modal-overlay" id="event-modal">
  <div class="modal modal-lg event-modal-flat event-modal-modern event-workspace-v4-exact">
    <!-- Accent bar -->
    <div class="event-modal-accent" id="event-modal-accent"></div>
    <!-- Grabber (mobile bottom-sheet handle) -->
    <div class="em-grabber"></div>

    <!-- Header (Exact V4) -->
    <div class="emw-header">
      <div class="emw-title-zone">
        <div class="emw-kind" id="event-modal-kind">ВКС</div>
        <div class="emw-heading">
          <h3 id="event-modal-title">Добавить ВКС</h3>
          <div class="emw-subtitle" id="event-modal-subtitle">Новое событие</div>
        </div>
      </div>
      <div class="emw-head-actions">
        <div class="modal-event-status" id="event-modal-status" style="display:none"></div>
        <input type="checkbox" id="f-event-completed" style="display:none">
        <button class="icon-btn info" id="event-modal-audit-btn" style="display:none" title="История изменений">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </button>
        <button class="icon-btn danger" id="event-modal-delete-btn" onclick="confirmDeleteFromModal()" style="display:none" title="Удалить событие">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
        <button class="icon-btn" onclick="requestCloseEventModal()" title="Закрыть">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Body wrapper: form + timeline side panel -->
    <div class="event-modal-body-wrapper">
      <div class="modal-body">
        <!-- Lock info banner -->
        <div class="modal-lock-info" id="event-modal-lock-info" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <span id="event-modal-lock-text"></span>
        </div>
        <!-- Скрытые контейнеры для совместимости с JS -->
        <div class="modal-event-actions" id="event-modal-actions" style="display:none"></div>

        <!-- Split (desktop) / Cards (mobile) grid -->
        <div class="em-grid">
          <!-- ─── Основная колонка ─── -->
          <div class="em-col em-col-main">
            <section class="em-card" data-sec="main">
              <div class="em-card-head">
                <span class="em-card-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                <span class="em-card-title">Основное</span>
              </div>

              <!-- Основные поля: 2×2 -->
              <div class="em-grid2 em-schedule-grid">
                <div class="form-group" id="f-event-type-group">
                  <label>Тип мероприятия</label>
                  <select id="f-event-type" class="form-input" onchange="onEventTypeChange()">
                    <option value="ВКС">ВКС</option><option value="Совещание">Совещание</option><option value="Встреча">Встреча</option><option value="Заседание">Заседание</option><option value="Приём">Личный приём</option>
                  </select>
                </div>
                <div class="form-group"><label>Дата *</label><input type="date" id="f-event-date" required></div>
                <div class="form-group"><label>Время *</label><input type="time" id="f-event-time" required></div>
                <div class="form-group"><label>Продолжительность</label><select id="f-event-duration" class="form-input"><option value="30">30 мин</option><option value="60" selected>1 час</option><option value="90">1.5 часа</option><option value="120">2 часа</option><option value="180">3 часа</option></select></div>
              </div>

              <!-- Локация и организатор: общая линия подписей и контролов -->
              <div class="em-grid2 em-identity-grid">
                <div class="form-group">
                  <div class="em-field-label-row"><label>Локация *</label></div>
                  <select id="f-event-location" class="form-input" required><option value="">Не указана</option></select>
                </div>
                <div class="form-group">
                  <div class="em-field-label-row">
                    <label>Организатор *</label>
                    <div class="em-organizer-toggle" role="group" aria-label="Тип организатора">
                      <button type="button" data-organizer-type="org" onclick="setEventOrganizerType('org')">Организация</button>
                      <button type="button" data-organizer-type="user" onclick="setEventOrganizerType('user')">Сотрудник</button>
                    </div>
                  </div>
                  <select id="f-event-organizer-type" class="form-input" hidden onchange="onOrganizerTypeChange()"><option value="org">Организация</option><option value="user">Сотрудник</option></select>
                  <select id="f-event-organizer" class="form-input" required><option value="">Не указан</option></select>
                </div>
              </div>

              <!-- Описание -->
              <div class="form-group">
                <label>Описание</label>
                <textarea id="f-event-desc" rows="2" placeholder="Описание встречи..." maxlength="200"></textarea>
                <span class="form-hint">Максимум 200 символов</span>
              </div>

              <!-- Ссылка (только для ВКС) -->
              <div class="form-group" id="f-event-url-group">
                <label>Ссылка</label>
                <div class="url-row">
                  <input type="text" id="f-event-url" placeholder="https://meet.example.com/...">
                  <a class="url-go-btn" id="event-url-go" href="#" target="_blank" rel="noopener" title="Открыть ссылку" style="display:none">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                  </a>
                </div>
              </div>
            </section>
          </div>

          <!-- ─── Боковая колонка ─── -->
          <div class="em-col em-col-aside">
            <!-- Участники -->
            <section class="em-card" data-sec="participants">
              <div class="em-card-head">
                <span class="em-card-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg></span>
                <span class="em-card-title">Участники</span>
                <span class="docs-label" id="event-participants-count"></span>
              </div>
              <div class="event-participants-list" id="event-participants-list"></div>
              <div class="event-participant-add">
                <input type="text" id="event-participant-search" class="form-input" placeholder="Поиск сотрудника..." oninput="searchParticipants(this.value)">
                <div class="event-participant-dropdown" id="event-participant-dropdown" style="display:none"></div>
              </div>
            </section>

            <!-- Документы -->
            <section class="em-card" data-sec="docs" id="f-event-docs-group" style="display:none">
              <div class="em-card-head">
                <span class="em-card-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                <span class="em-card-title">Документы</span>
                <span class="docs-label" id="f-event-docs-count"></span>
              </div>
              <div class="doc-scroll-wrap">
                <div class="doc-scroll-fade-top" id="doc-fade-top"></div>
                <div id="f-event-docs" class="doc-card-list"></div>
                <div class="doc-scroll-fade-bottom" id="doc-fade-bottom"></div>
              </div>
              <label class="doc-add-btn" id="event-doc-upload-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Добавить документ
                <input type="file" id="event-doc-upload" style="display:none" multiple onchange="addPendingFiles(this.files); this.value=''">
              </label>
            </section>

            <!-- Повтор -->
            <section class="em-card em-repeat-card" data-sec="repeat" id="event-repeat-card">
              <button type="button" class="em-repeat-summary" id="event-repeat-btn" onclick="openRepeatModal()" aria-expanded="false">
                <span class="em-card-ic">↻</span><span><strong>Повтор</strong><small id="event-repeat-label">Один раз</small></span><span class="em-repeat-chevron">⌄</span>
              </button>
              <input type="hidden" id="event-repeat-active" value="false"><input type="hidden" id="event-repeat-type" value="once">
              <div class="em-repeat-editor" id="event-repeat-editor">
                <div class="evt-repeat-type-row">
                  <button type="button" class="evt-repeat-type-btn active" data-type="once" onclick="switchRepeatType('once')">Один раз</button>
                  <button type="button" class="evt-repeat-type-btn" data-type="daily" onclick="switchRepeatType('daily')">День</button>
                  <button type="button" class="evt-repeat-type-btn" data-type="weekly" onclick="switchRepeatType('weekly')">Неделя</button>
                  <button type="button" class="evt-repeat-type-btn" data-type="monthly" onclick="switchRepeatType('monthly')">Месяц</button>
                </div>
                <div class="evt-repeat-panel is-hidden" id="repeat-panel-daily" aria-hidden="true">
                  <label class="evt-repeat-option"><input type="radio" name="repeat-daily-mode" value="interval" checked onchange="onRepeatDailyModeChange()">Каждый <input type="number" id="repeat-daily-interval" class="evt-repeat-num-input" value="1" min="1" max="365" oninput="onRepeatRuleChange()"> день</label>
                  <label class="evt-repeat-option"><input type="radio" name="repeat-daily-mode" value="workdays" onchange="onRepeatDailyModeChange()">В рабочие дни (Пн–Пт)</label>
                </div>
                <div class="evt-repeat-panel is-hidden" id="repeat-panel-weekly" aria-hidden="true">
                  <div class="evt-repeat-inline">Каждую <input type="number" id="repeat-weekly-interval" class="evt-repeat-num-input" value="1" min="1" max="52" oninput="onRepeatRuleChange()"> неделю</div>
                  <div class="evt-weekday-row" id="repeat-weekday-row">
                    <button type="button" class="evt-wd-btn" data-day="mon" onclick="toggleRepeatWeekday(this)">Пн</button><button type="button" class="evt-wd-btn" data-day="tue" onclick="toggleRepeatWeekday(this)">Вт</button><button type="button" class="evt-wd-btn" data-day="wed" onclick="toggleRepeatWeekday(this)">Ср</button><button type="button" class="evt-wd-btn" data-day="thu" onclick="toggleRepeatWeekday(this)">Чт</button><button type="button" class="evt-wd-btn" data-day="fri" onclick="toggleRepeatWeekday(this)">Пт</button><button type="button" class="evt-wd-btn" data-day="sat" onclick="toggleRepeatWeekday(this)">Сб</button><button type="button" class="evt-wd-btn" data-day="sun" onclick="toggleRepeatWeekday(this)">Вс</button>
                  </div>
                </div>
                <div class="evt-repeat-panel is-hidden" id="repeat-panel-monthly" aria-hidden="true"><div class="evt-repeat-inline">Каждые <input type="number" id="repeat-monthly-interval" class="evt-repeat-num-input" value="1" min="1" max="12" oninput="onRepeatRuleChange()"> мес., <span id="repeat-monthly-day" class="evt-repeat-day-badge">—</span> числа</div></div>
                <div class="evt-repeat-until-row"><label>До даты</label><input type="date" id="event-repeat-until" class="form-input" onchange="onRepeatRuleChange()"></div>
                <div class="em-repeat-preview"><div class="em-repeat-preview-head"><span>Ближайшие события</span><span id="event-repeat-preview-more"></span></div><div id="event-repeat-preview-dates" class="em-repeat-preview-dates"><span class="em-repeat-preview-empty">Повтор отключён</span></div></div>
                <button type="button" class="em-repeat-remove" id="repeat-delete-btn" onclick="deleteRepeatModal()">Отключить повтор</button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <span class="event-modal-dirty" id="event-modal-dirty" aria-live="polite"><i></i>Есть несохранённые изменения</span>
      <button class="btn btn-ghost" onclick="requestCloseEventModal()">Отмена</button>
      <div class="footer-right">
        <button class="pill-btn complete" id="event-modal-complete-btn" onclick="toggleEventComplete()" style="display:none">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span class="pill-label">Завершить</span>
        </button>
        <button class="btn btn-primary" id="event-modal-save-btn" onclick="saveEvent()">Сохранить</button>
      </div>
    </div>
    <!-- История изменений — выезжающая панель внутри модалки -->
    <div class="event-timeline-backdrop" id="event-modal-audit-backdrop" style="display:none" onclick="hideEventHistory()"></div>
    <div class="event-timeline" id="event-modal-audit" style="display:none">
      <div class="tl-head">
        <h4>История изменений</h4>
        <button type="button" class="icon-btn" onclick="hideEventHistory()" title="Закрыть">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="tl-body" id="event-modal-audit-body"></div>
    </div>
  </div>
</div>
