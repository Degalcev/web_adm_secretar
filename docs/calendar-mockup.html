<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь VKS — Макет</title>
<style>
:root {
    --bg: #0f1117;
    --bg-elevated: #1a1d27;
    --surface: #1e2130;
    --surface-strong: #252838;
    --border: #2a2d3e;
    --border-strong: #3a3d4e;
    --fg: #e4e4e7;
    --fg-muted: #71717a;
    --fg-secondary: #a1a1aa;
    --accent: #6366f1;
    --accent-ambient: #818cf8;
    --success: #4ade80;
    --danger: #f87171;
    --warning: #fbbf24;
    --font-sans: 'Inter', -apple-system, sans-serif;
    --motion-fast: 150ms ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }

/* ─── Header ─────────────────────────────────────────────── */
.cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.cal-nav { display: flex; align-items: center; gap: 8px; }

.cal-nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--fg);
    font-size: 0.8125rem;
    transition: background var(--motion-fast);
}
.cal-nav-btn:hover { background: var(--surface-strong); }

.cal-title { font-size: 1rem; font-weight: 600; }

.cal-today-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 0.8125rem;
    font-weight: 500;
    cursor: pointer;
}
.cal-today-btn:hover { opacity: 0.85; }

/* ─── Day tabs ───────────────────────────────────────────── */
.cal-days {
    display: flex;
    gap: 4px;
    padding: 8px 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
}

.cal-day-tab {
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.75rem;
    text-align: center;
    min-width: 60px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    transition: all var(--motion-fast);
}
.cal-day-tab:hover { background: var(--surface-strong); color: var(--fg); }
.cal-day-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}
.cal-day-tab .day-num { font-weight: 600; font-size: 0.875rem; display: block; }
.cal-day-tab .day-name { font-size: 0.625rem; text-transform: uppercase; opacity: 0.7; }

/* ─── Grid ───────────────────────────────────────────────── */
.cal-grid-wrapper {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
}

.cal-grid {
    display: grid;
    grid-template-columns: 60px repeat(4, 1fr);
    min-width: 600px;
    position: relative;
}

/* Time column */
.cal-time-col {
    border-right: 1px solid var(--border);
    background: var(--surface);
}
.cal-time-header {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--fg-muted);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 3;
}
.cal-time-slot {
    height: 60px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 4px 8px;
    font-size: 0.6875rem;
    color: var(--fg-muted);
    border-bottom: 1px solid var(--border);
}

/* Location columns */
.cal-loc-col {
    border-right: 1px solid var(--border);
    position: relative;
}
.cal-loc-col:last-child { border-right: none; }

.cal-loc-header {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--fg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 3;
}

/* Cells */
.cal-cell {
    height: 60px;
    border-bottom: 1px solid var(--border);
    position: relative;
    padding: 1px;
}
.cal-cell:nth-child(even) { background: rgba(255,255,255,0.015); }

/* Events */
.cal-cell-events {
    display: flex;
    gap: 2px;
    height: 100%;
}

.cal-event {
    flex: 1;
    min-width: 0;
    border-radius: 4px;
    padding: 3px 5px;
    font-size: 0.625rem;
    overflow: hidden;
    cursor: pointer;
    border-left: 3px solid var(--accent);
    background: rgba(99, 102, 241, 0.08);
    transition: transform var(--motion-fast), box-shadow var(--motion-fast);
}
.cal-event:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 2;
}
.cal-event.completed { border-left-color: var(--success); background: rgba(74, 222, 128, 0.08); }
.cal-event.missed { border-left-color: var(--danger); background: rgba(248, 113, 113, 0.08); }

.cal-event-type { font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-event-org { color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-event-desc { color: var(--fg-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

/* Now line */
.cal-now-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--danger);
    z-index: 5;
    pointer-events: none;
}
.cal-now-line::before {
    content: '';
    position: absolute;
    left: -4px;
    top: -4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
}

/* Scrollbar */
.cal-grid-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
.cal-grid-wrapper::-webkit-scrollbar-track { background: transparent; }
.cal-grid-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- Header -->
<div class="cal-header">
    <div class="cal-nav">
        <button class="cal-nav-btn">←</button>
        <span class="cal-title">7 – 13 июля 2026</span>
        <button class="cal-nav-btn">→</button>
    </div>
    <button class="cal-today-btn">Сегодня</button>
</div>

<!-- Day tabs -->
<div class="cal-days">
    <div class="cal-day-tab" onclick="selectDay(0)"><span class="day-name">Пн</span><span class="day-num">7</span></div>
    <div class="cal-day-tab" onclick="selectDay(1)"><span class="day-name">Вт</span><span class="day-num">8</span></div>
    <div class="cal-day-tab active" onclick="selectDay(2)"><span class="day-name">Ср</span><span class="day-num">9</span></div>
    <div class="cal-day-tab" onclick="selectDay(3)"><span class="day-name">Чт</span><span class="day-num">10</span></div>
    <div class="cal-day-tab" onclick="selectDay(4)"><span class="day-name">Пт</span><span class="day-num">11</span></div>
    <div class="cal-day-tab" onclick="selectDay(5)"><span class="day-name">Сб</span><span class="day-num">12</span></div>
    <div class="cal-day-tab" onclick="selectDay(6)"><span class="day-name">Вс</span><span class="day-num">13</span></div>
</div>

<!-- Grid -->
<div class="cal-grid-wrapper">
    <div class="cal-grid" id="cal-grid"></div>
</div>

<script>
const HOURS_START = 6;
const HOURS_END = 23;
const HOUR_HEIGHT = 60;

const locations = ['Зал 1', 'Зал 2', 'Зал 3', 'Без зала'];

// Demo events for Wednesday (index 2)
const demoEvents = {
    '2_0': [ // Зал 1, 08:00
        { type: 'ВКС', org: 'Иванов И.И.', desc: 'Совещание с заказчиком', status: '' },
    ],
    '2_1': [ // Зал 2, 09:00
        { type: 'ВКС', org: 'Петров П.П.', desc: 'Техническое совещание', status: 'completed' },
    ],
    '2_2': [ // Зал 3, 10:00 — overlap!
        { type: 'ВКС', org: 'Сидоров С.С.', desc: 'Презентация проекта', status: '' },
        { type: 'Совещание', org: 'Козлов К.К.', desc: 'Планирование спринта', status: '' },
    ],
    '2_0_11': [ // Зал 1, 11:00
        { type: 'ВКС', org: 'Михайлов М.М.', desc: 'Созвон с офисом', status: 'missed' },
    ],
    '2_1_14': [ // Зал 2, 14:00
        { type: 'ВКС', org: 'Новиков Н.Н.', desc: '', status: '' },
    ],
    '2_3_15': [ // Без зала, 15:00
        { type: 'ВКС', org: 'Федоров Ф.Ф.', desc: 'Онлайн встреча', status: '' },
    ],
    '2_0_16': [ // Зал 1, 16:00 — overlap
        { type: 'ВКС', org: 'Волков В.В.', desc: 'Демо продукта', status: '' },
        { type: 'ВКС', org: 'Лебедев Л.Л.', desc: 'Код-ревью', status: '' },
        { type: 'Совещание', org: 'Павлов П.П.', desc: 'Ретроспектива', status: '' },
    ],
};

function selectDay(idx) {
    document.querySelectorAll('.cal-day-tab').forEach((t, i) => {
        t.classList.toggle('active', i === idx);
    });
}

function renderGrid() {
    const grid = document.getElementById('cal-grid');
    let html = '';

    // Time column header
    html += '<div class="cal-time-col"><div class="cal-time-header">Время</div>';
    for (let h = HOURS_START; h < HOURS_END; h++) {
        html += `<div class="cal-time-slot">${String(h).padStart(2, '0')}:00</div>`;
    }
    html += '</div>';

    // Location columns
    locations.forEach((loc, li) => {
        html += `<div class="cal-loc-col"><div class="cal-loc-header">${loc}</div>`;

        for (let h = HOURS_START; h < HOURS_END; h++) {
            const key = `2_${li}_${h}`;
            const events = demoEvents[key] || [];

            html += `<div class="cal-cell"><div class="cal-cell-events">`;
            events.forEach(e => {
                html += `<div class="cal-event ${e.status}" title="${e.type} — ${e.org}">`;
                html += `<div class="cal-event-type">${e.type}</div>`;
                html += `<div class="cal-event-org">${e.org}</div>`;
                if (e.desc) html += `<div class="cal-event-desc">${e.desc}</div>`;
                html += '</div>';
            });
            html += '</div></div>';
        }

        html += '</div>';
    });

    grid.innerHTML = html;

    // Now line (simulated at 14:30)
    const nowMinutes = 14 * 60 + 30;
    const top = (14 - HOURS_START) * HOUR_HEIGHT + (30 / 60) * HOUR_HEIGHT;
    const line = document.createElement('div');
    line.className = 'cal-now-line';
    line.style.top = (40 + top) + 'px'; // 40 = header height
    grid.appendChild(line);
}

renderGrid();

// Scroll to 08:00
document.querySelector('.cal-grid-wrapper').scrollTop = (8 - HOURS_START) * HOUR_HEIGHT;
</script>
</body>
</html>
